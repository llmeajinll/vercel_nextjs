<rect x="380.0" y="70.0" width="760.0" height="930.0" rx="4" fill="#F7F8F8" stroke="#9AA1A9" stroke-dasharray="6 4"/>
<foreignObject x="380.0" y="70.0" width="760.0" height="930.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:12px;padding-top:6px;font-size:14px;line-height:1.45;color:#14181F;font-weight:700;word-break:keep-all;overflow-wrap:anywhere">Vercel · Next.js 서버</div></foreignObject>
<rect x="1200.0" y="70.0" width="400.0" height="930.0" rx="4" fill="#F7F8F8" stroke="#9AA1A9" stroke-dasharray="6 4"/>
<foreignObject x="1200.0" y="70.0" width="400.0" height="930.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:12px;padding-top:6px;font-size:14px;line-height:1.45;color:#14181F;font-weight:700;word-break:keep-all;overflow-wrap:anywhere">외부 서비스 · 데이터</div></foreignObject>
<foreignObject x="20.0" y="4.0" width="800.0" height="62.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:0.0px;padding-top:0.0px;font-size:20px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>NEXT GACHA 시스템 구성도</b><br/><font style="font-size:12px" color="#535B66">Next.js 16 (App Router) · 같은 상품 1인당 최대 5개 제한 쇼핑몰</font></div></foreignObject>
<rect x="40.0" y="120.0" width="120.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="40.0" y="120.0" width="120.0" height="50.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0.0px;padding-top:0.0px;font-size:13px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>고객</b></div></foreignObject>
<rect x="180.0" y="120.0" width="120.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="180.0" y="120.0" width="120.0" height="50.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0.0px;padding-top:0.0px;font-size:13px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>관리자</b><br/><font style="font-size:11px">ADMIN_EMAILS</font></div></foreignObject>
<rect x="40.0" y="230.0" width="260.0" height="210.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="40.0" y="230.0" width="260.0" height="210.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>Next.js 클라이언트</b><br/>FSD: views → widgets → features → entities → shared<br/><br/>• TanStack Query: 서버 상태·캐시<br/>• Jotai: 상세 페이지의 선택 수량(메모리)<br/>• Vanilla Extract: 컴파일 타임 스타일<br/>• API는 /api/... 상대 경로로 호출</div></foreignObject>
<rect x="40.0" y="500.0" width="260.0" height="260.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="40.0" y="500.0" width="260.0" height="260.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>결제 흐름</b><br/><br/>1. /checkout/[orderId]<br/>2. 토스 SDK 결제창 (브라우저 ↔ Toss)<br/>3. 성공 시 /success (paymentKey)<br/>4. POST /api/postPaymentsConfirm<br/>5. 서버 승인·DB 반영 (아래 서버 공용 로직)<br/>6. 실패·이탈 시 /fail<br/><br/><font color="#535B66">금액·포인트는 클라이언트 값을 믿지 않고 서버가 DB로 다시 계산</font></div></foreignObject>
<rect x="40.0" y="800.0" width="260.0" height="110.0" rx="8" fill="#FFF6BF" stroke="#14181F"/>
<foreignObject x="40.0" y="800.0" width="260.0" height="110.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>5개 제한은 세 번 검사</b><br/>① 클라이언트 훅(즉시 안내)<br/>② 장바구니 API (checkCartLimit)<br/>③ 결제 승인 (verifyOrder → reducePoint)</div></foreignObject>
<rect x="400.0" y="120.0" width="720.0" height="135.0" rx="8" fill="#FFE14D" stroke="#14181F"/>
<foreignObject x="400.0" y="120.0" width="720.0" height="135.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>proxy.ts (Next.js middleware)</b><br/>• /api/protected/* → 로그인 아니면 401<br/>• 관리자 API 7종 → ADMIN_EMAILS가 아니면 403<br/>• /manager/* → 비관리자는 / 로 이동 (/manager, /manager/statistics는 공개) · /mypage/* → /signin<br/>• 페이지 조회마다 POST /api/track (event.waitUntil, prefetch 제외)</div></foreignObject>
<rect x="400.0" y="290.0" width="330.0" height="270.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="400.0" y="290.0" width="330.0" height="270.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>페이지 (Server Components)</b><br/>• /main · /search · /notice<br/>• /[code] (info · review · qna 탭)<br/>• /mypage (like · cart · history)<br/>• /(payment) checkout · success · fail<br/>• /manager (product_add · product_manage · order · user · event · error · statistics)<br/><br/><font color="#535B66">자기 /api를 fetch하지 않음 (세션 쿠키가 실리지 않아 401/403). 공용 서버 함수로 DB를 직접 조회</font></div></foreignObject>
<rect x="760.0" y="290.0" width="360.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="760.0" y="290.0" width="360.0" height="250.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>API Routes (BFF) · 20여 개</b><br/>• /api/protected/* (로그인 필요): getHistory · getLike · updateLike · postCart · postReview · postQna · deleteQuestion …<br/>• 관리자 7종: postProduct · postEditProduct · postEvent · postCheckToSending · postSendingToFinish · getOrderSort · getError<br/>• 결제: postPaymentsConfirm<br/>• 그 외: getProduct · getOneProduct · getReview · getQna · getCart · updateCart · getUser · updateAddress · getStatistics · postCheckStock · postError · track</div></foreignObject>
<rect x="900.0" y="580.0" width="220.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="900.0" y="580.0" width="220.0" height="80.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:8.0px;padding-top:8.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>NextAuth v5 (Kakao만)</b><br/>첫 로그인 시 user 문서 생성 (포인트 0)</div></foreignObject>
<rect x="400.0" y="720.0" width="720.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#14181F"/>
<foreignObject x="400.0" y="720.0" width="720.0" height="150.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>서버 공용 로직 · shared/api/mongodb.ts</b><br/>• 단일 MongoClient (모듈 로드 시 연결) · 컬렉션 핸들을 하나씩 export<br/>• features/purchase/lib: validateStock → verifyOrder → (Toss 승인) → withTransaction( reducePoint → reduceStock → addOrder → resetCart ) · 가격·배송·포인트 규칙은 orderPolicy.ts<br/>• features/order-manage/lib: findOrdersByStatus (페이지와 API가 함께 사용) · 상태 변경은 status 필터로 중복 클릭을 무효화</div></foreignObject>
<foreignObject x="400.0" y="880.0" width="720.0" height="24.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:0.0px;padding-top:0.0px;font-size:11px;line-height:1.45;color:#535B66;word-break:keep-all;overflow-wrap:anywhere">트랜잭션 실패 시 Toss 결제를 취소하고, 취소마저 실패하면 errorColl에 기록</div></foreignObject>
<rect x="1220.0" y="290.0" width="360.0" height="110.0" rx="8" fill="#E9ECEE" stroke="#14181F"/>
<foreignObject x="1220.0" y="290.0" width="360.0" height="110.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>TossPayments</b><br/>• 결제창 (브라우저 SDK)<br/>• 서버: 승인 confirm · 취소 cancel<br/>• 결제 실패·환불 시 취소</div></foreignObject>
<rect x="1220.0" y="440.0" width="360.0" height="80.0" rx="8" fill="#E9ECEE" stroke="#14181F"/>
<foreignObject x="1220.0" y="440.0" width="360.0" height="80.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>Vercel Blob</b><br/>상품 이미지 images/{번호}.png (postProduct의 put)</div></foreignObject>
<rect x="1220.0" y="580.0" width="360.0" height="80.0" rx="8" fill="#E9ECEE" stroke="#14181F"/>
<foreignObject x="1220.0" y="580.0" width="360.0" height="80.0"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:10.0px;padding-top:10.0px;font-size:12px;line-height:1.45;color:#14181F;word-break:keep-all;overflow-wrap:anywhere"><b>Kakao OAuth</b><br/>이메일을 주지 않으면 로그인 거부</div></foreignObject>
